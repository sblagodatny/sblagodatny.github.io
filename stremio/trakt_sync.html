<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stremio Account Manager</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #14121f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1f1b2e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 750px;
        }
        h2 { text-align: center; color: #eeeeee; margin-bottom: 24px; }
        
        /* Auth States */
        #loginState, #appState { display: none; }

        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; color: #bbb; font-size: 14px; }
        input {
            padding: 10px;
            border: 1px solid #3d355c;
            border-radius: 4px;
            background-color: #14121f;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #8a5cf5; }
        
        .btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-primary { background-color: #8a5cf5; width: 100%; }
        .btn-primary:hover { background-color: #7246d0; }
        .btn-danger { background-color: #ff4a4a; padding: 6px 12px; font-size: 13px; }
        .btn-danger:hover { background-color: #d63030; }
        
        /* Dashboard Header */
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #14121f;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .user-info { font-size: 14px; color: #bbb; }
        .user-info strong { color: #fff; }
       
        #statusMessage {
            margin-top: 15px;
            padding: 12px;
            border-radius: 4px;
            background-color: #2c2541;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Stremio Account Manager</h2>

    <!-- STATE 1: LOGIN FORM -->
    <div id="loginState">
        <form id="loginForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Stremio Email</label>
                    <input type="email" id="email" required placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Stremio Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
        </form>
    </div>

    <!-- STATE 2: ACTIVE REPO VIEW -->
    <div id="appState">
        <div class="user-header">
            <div class="user-info">Logged in as: <strong id="userDisplay"></strong></div>
            <button class="btn btn-danger" id="logoutBtn">Logout</button>
        </div>
        
        <!-- Updated synchronization activation button -->
        <button class="btn btn-primary" id="syncBtn">Trakt Sync</button>

        <div id="statusMessage"></div>

    </div>
</div>

<script>
    // Constants
    const STREMIO_TRAKT_CLIENT_ID = "0e861f52c7365efe6da5ea3e2e6641b8d25d87aca3133e8d4f7dc8487368d14b";

    // DOM Elements
    const loginState = document.getElementById('loginState');
    const appState = document.getElementById('appState');
    const loginForm = document.getElementById('loginForm');
    const syncBtn = document.getElementById('syncBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const statusMessage = document.getElementById('statusMessage');
    const userDisplay = document.getElementById('userDisplay');

	let stremioProfile;

    // On Load: Get stremio profile if token saved
    window.addEventListener('DOMContentLoaded', async () => {        		
		try {
			const token = localStorage.getItem('stremio_token');									
			if (token) {
				const stremioProfileResponse = await fetch('https://api.strem.io/api/getUser', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ authKey: token })
				});			
				const data = await stremioProfileResponse.json();	
				if (data.error) throw new Error(data.error.message || 'Invalid stremio token');				
				stremioProfile = data.result;
				stremioProfile.authKey = token;
			}								
			if (stremioProfile) showDashboard();
			else showLogin();											
		} catch (error) {
            alert(`Error: ${error.message}`);			
			showLogin();
		}
		
    });

    // Handle Login Form Submission
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        loginBtn.innerText = 'Connecting...';
        try {
            const response = await fetch('https://api.strem.io/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: "Login", email, password })
            });
            const data = await response.json();            
            if (data.error) 
				throw new Error(data.error.message || 'Login failed');
            localStorage.setItem('stremio_token', data.result.authKey);
			stremioProfile = data.result.user;
			stremioProfile.authKey = data.result.authKey;
            showDashboard();
        } catch (error) {
            alert(`Authentication Error: ${error.message}`);
        } finally {
            loginBtn.disabled = false;
            loginBtn.innerText = 'Login';
        }
    });
	
	
	 // Logout button
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('stremio_token');
        showLogin();
    });

    // Display Component State Toggles
    function showLogin() {
        appState.style.display = 'none';
        loginState.style.display = 'block';
        loginForm.reset();
    }

    function showDashboard() {
        loginState.style.display = 'none';
        appState.style.display = 'block';
        userDisplay.innerText = stremioProfile.email;
    }
	
	

    // Manual Sync Button Trigger
    syncBtn.addEventListener('click', () => {
		runSync();        
    });

   

    // Core Request & Diff Comparison Function
    async function runSync() {
		
		try {
		
			syncBtn.disabled = true;
			statusMessage.style.color = '#fff';
			
			traktToken = stremioProfile.trakt?.access_token || null;
			if (!traktToken) throw new Error('Trakt account not set in Stremio');
		
		
			// Get watched items from stremio			
			statusMessage.innerText = 'Getting stremio data...';			
			const stremioRes = await fetch('https://api.strem.io/api/datastoreGet', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },			
				body: JSON.stringify({ 
					authKey: stremioProfile.authKey, 
					collection: "libraryItem",
					all: true 
				})				
			});
			const stremioData = await stremioRes.json();
			if (stremioData.error) throw new Error(`Unable to fetch stremio data: ${stremioData.error.message}`);														
			const watchedMoviesMapStremio = {}; // format: "ttIMDB -> watchedDate
			const watchedSeriesMapStremio = {}; // format: "ttIMDB -> {season,episode, watchedDate} for last watched episode       
			stremioData.result.forEach(item => {
				if (!item._id.startsWith('tt') || !item.state) return;
				if (item.type === 'movie') {
					if (item.state.timesWatched > 0 || item.state.flaggedWatched === 1) watchedMoviesMapStremio[item._id] = item.state.lastWatched || new Date().toISOString();                
				} else if (item.type === 'series' && item.state.video_id) {
					const parts = item.state.video_id.split(':');					
					const showImdbId = parts[0];
					watchedSeriesMapStremio[showImdbId] = {
						season: parseInt(parts[1], 10),
						episode: parseInt(parts[2], 10),
						date: item.state.lastWatched || new Date().toISOString()
					};
					
				}
			});
												
			
			
			// Get watched items from trakt			
			statusMessage.innerText = 'Getting trakt data (movies)...';                        
			const traktMovieRes = await fetch('https://api.trakt.tv/sync/watched/movies', {
				method: 'GET',
				headers: {
					'Content-Type': 'application/json',
					'Authorization': `Bearer ${traktToken}`,
					'trakt-api-version': '2',
					'trakt-api-key': STREMIO_TRAKT_CLIENT_ID
				}           
			});
			const traktMovieData = await traktMovieRes.json();
			const watchedMoviesMapTrakt = traktMovieData.reduce((map, item) => {
				const imdbId = item.movie && item.movie.ids && item.movie.ids.imdb; 
				if (imdbId) map[imdbId] = item.last_watched_at;
				return map;
			}, {});
			statusMessage.innerText = 'Getting trakt data (series)...';
			const traktShowRes = await fetch('https://api.trakt.tv/sync/watched/shows', {
				method: 'GET',
				headers: {
					'Content-Type': 'application/json',
					'Authorization': `Bearer ${traktToken}`,
					'trakt-api-version': '2',
					'trakt-api-key': STREMIO_TRAKT_CLIENT_ID
				}           
			});
			const traktShowData = await traktShowRes.json();									
			const watchedSeriesMapTrakt = {};  // format: "ttIMDB -> {season,episode, watchedDate} for last watched episode  
			traktShowData.forEach(showItem => {
				const showImdbId = showItem.show?.ids?.imdb;
				if (!showImdbId) return;
				let maxSeason = 0;
				let maxEpisode = 0;
				let lastWatchedAt = null;
				showItem.seasons.forEach(season => {
					season.episodes.forEach(episode => {
						if (season.number > maxSeason || (season.number === maxSeason && episode.number > maxEpisode)) {
							maxSeason = season.number;
							maxEpisode = episode.number;
							lastWatchedAt = episode.last_watched_at;
						}
					});
				});
				if (maxSeason > 0) {
					watchedSeriesMapTrakt[showImdbId] = {
						season: maxSeason,
						episode: maxEpisode,
						date: lastWatchedAt || new Date().toISOString()
					};
				}
			});
			
			
			
			
			// Calculate Diffs for movies
			const missingMoviesMapStremio = Object.keys(watchedMoviesMapTrakt)
				.filter(imdbId => !watchedMoviesMapStremio.hasOwnProperty(imdbId))
				.reduce((map, imdbId) => { map[imdbId] = watchedMoviesMapTrakt[imdbId]; return map; }, {});
			const missingMoviesMapTrakt = Object.keys(watchedMoviesMapStremio)
				.filter(imdbId => !watchedMoviesMapTrakt.hasOwnProperty(imdbId))
				.reduce((map, imdbId) => { map[imdbId] = watchedMoviesMapStremio[imdbId]; return map; }, {});
		

			// 4. Calculate Diffs for series
			const missingSeriesMapStremio = {}; // Maps: imdbId -> { season, episode, date }
			const missingSeriesMapTrakt = {};   // Maps: imdbId -> { season, episode, date }
			const unsyncedSeriesMap = {};		// Maps: imdbId -> { stremio: {...}, trakt: {...} }
			const syncedSeriesMap = {};         // Maps: imdbId -> { season, episode, date }
			const allShowIds = new Set([...Object.keys(watchedSeriesMapStremio), ...Object.keys(watchedSeriesMapTrakt)]);
			allShowIds.forEach(showId => {
				const stremioSeries = watchedSeriesMapStremio[showId];
				const traktSeries = watchedSeriesMapTrakt[showId];
				if (stremioSeries && !traktSeries) missingSeriesMapTrakt[showId] = stremioSeries;            
				else if (!stremioSeries && traktSeries) missingSeriesMapStremio[showId] = traktSeries;            
				else {
					if (stremioSeries.season === traktSeries.season && stremioSeries.episode === traktSeries.episode) {
						syncedSeriesMap[showId] = stremioSeries
					} else {                    
						unsyncedSeriesMap[showId] = { stremio: stremioSeries, trakt: traktSeries };
					}
				}              
			});

        
			// Sync summary
			const totalMissingMoviesStremio = Object.keys(missingMoviesMapStremio).length;
			const totalMissingMoviesTrakt = Object.keys(missingMoviesMapTrakt).length;
			const totalInSyncMovies = Object.keys(watchedMoviesMapStremio).length - totalMissingMoviesTrakt;
			const totalInSyncSeries = Object.keys(syncedSeriesMap).length;
			const totalMissingSeriesStremio = Object.keys(missingSeriesMapStremio).length;
			const totalMissingSeriesTrakt = Object.keys(missingSeriesMapTrakt).length;
			const totalUnsyncedSeries = Object.keys(unsyncedSeriesMap).length;
			const needsSync = totalMissingMoviesStremio > 0 || totalMissingMoviesTrakt > 0 || totalMissingSeriesStremio > 0 || totalMissingSeriesTrakt > 0 || totalUnsyncedSeries > 0;        
			if (!needsSync) {
				statusMessage.innerText = `Everything in sync (Movies: ${totalInSyncMovies}, Series: ${totalInSyncSeries})`;
				return;
			}        
			statusMessage.innerText = `Ready for sync`;                
			const confirmationMessage = `Sync Summary:\n\n` +
				`[Movies]\n` +
				`- In Sync: ${totalInSyncMovies}\n` +
				`- Missing in Stremio: ${totalMissingMoviesStremio}\n` +
				`- Missing in Trakt: ${totalMissingMoviesTrakt}\n\n` +
				`[Series]\n` +
				`- In Sync: ${totalInSyncSeries}\n` +
				`- Missing in Stremio: ${totalMissingSeriesStremio}\n` +
				`- Missing in Trakt: ${totalMissingSeriesTrakt}\n` +
				`- Exists in both but has unsynced episodes: ${totalUnsyncedSeries}\n\n` +
				`Proceed with synchronization?`;
			if (!confirm(confirmationMessage)) {
				statusMessage.innerText = '';
				return;
			}
		
		
		
		
			const firstFive = Object.keys(missingSeriesMapStremio).slice(0, 5);
			alert(`First 5 missing series in Stremio:\n${firstFive.join('\n')}`);
	
			
			// Sync movies to stremio
			if (totalMissingMoviesStremio > 0) {				
				statusMessage.innerText = 'Updating Stremio...';				
				const stremioLibraryMap = stremioData.result.reduce((map, item) => {
					map[item._id] = item;
					return map;
				}, {});			
				const itemsToUpdate = [];							
				for (const [imdbId, watchedDate] of Object.entries(missingMoviesMapStremio)) {			
					if (stremioLibraryMap.hasOwnProperty(imdbId)) {
						// Item exists in stremio library. Update its watch state.
						const existingItem = stremioLibraryMap[imdbId];					
						if (!existingItem.state) existingItem.state = {};
						existingItem.state.flaggedWatched = 1;
						existingItem.state.timesWatched = (existingItem.state.timesWatched || 0) + 1;
						existingItem.state.lastWatched = watchedDate || new Date().toISOString();						
						itemsToUpdate.push(existingItem);
					}
					else {
						// Item does not exist in stremio library. Insert a minimal valid skeleton.
						const newItem = {
							_id: imdbId,
							type: 'movie',
							name: imdbId, // Fallback since we don't have metadata
							removed: true, // Prevents it from cluttering the user's main UI library
							temp: true,
								state: {
								flaggedWatched: 1,
								timesWatched: 1,
								lastWatched: watchedDate || new Date().toISOString()
							}
						};					
						itemsToUpdate.push(newItem);
					}			
				}		
				const updateRes = await fetch('https://api.strem.io/api/datastorePut', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						authKey: stremioProfile.authKey,
						collection: "libraryItem",
						changes: itemsToUpdate
					})
				});					
				const updateData = await updateRes.json();
				if (updateData.error) throw new Error(`Unable to update Stremio movies: ${updateData.error.message}`);				
			}


			// Sync movies to trakt
			if (totalMissingMoviesTrakt > 0) {			
				statusMessage.innerText = 'Updating Trakt...';            				
				const traktPayload = {
					movies: Object.entries(missingMoviesMapTrakt).map(([imdbId, watchedDate]) => ({
						ids: { imdb: imdbId },
						watched_at: watchedDate || new Date().toISOString()
					}))
				};
				const traktSyncRes = await fetch('https://api.trakt.tv/sync/history', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'Authorization': `Bearer ${traktToken}`,
						'trakt-api-version': '2',
						'trakt-api-key': STREMIO_TRAKT_CLIENT_ID
					},
					body: JSON.stringify(traktPayload)
				});
				if (!traktSyncRes.ok) {
					const errorData = await traktSyncRes.json().catch(() => ({}));
					throw new Error(`Unable to update Trakt movies: ${errorData.message || traktSyncRes.statusText}`);
				}				
			}

			
			// Sync series to Stremio
/*

// Determine what shows need updates from Trakt data (Missing + Unsynced where Trakt is ahead)

        // Process totally missing series in Stremio

            seriesUpdatesForStremio.push({ imdbId, data: traktData });
        }
        
        // Process out-of-sync series where Trakt is further along
        for (const [imdbId, syncData] of Object.entries(unsyncedSeriesMap)) {

               (syncData.trakt.season === syncData.stremio.season && syncData.trakt.episode > syncData.stremio.episode)) {
                seriesUpdatesForStremio.push({ imdbId, data: syncData.trakt });
            }
        }

                        }

        }

*/			
			
			// Sync series to Trakt

        }

			statusMessage.innerText = 'Sync completed successfully!';
			
		
		} catch (error) {           		
			statusMessage.style.color = '#ff6b6b';
			statusMessage.innerText = `Error: ${error.message}`;
			
		} finally {
			syncBtn.disabled = false;
		}
		
	}
	
	
	
</script>

</html>
