<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stremio Account Manager</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #14121f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1f1b2e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 750px;
        }
        h2 { text-align: center; color: #eeeeee; margin-bottom: 24px; }
        
        /* Auth States */
        #loginState, #appState { display: none; }

        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; color: #bbb; font-size: 14px; }
        input {
            padding: 10px;
            border: 1px solid #3d355c;
            border-radius: 4px;
            background-color: #14121f;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #8a5cf5; }
        
        .btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-primary { background-color: #8a5cf5; width: 100%; }
        .btn-primary:hover { background-color: #7246d0; }
        .btn-danger { background-color: #ff4a4a; padding: 6px 12px; font-size: 13px; }
        .btn-danger:hover { background-color: #d63030; }
        
        /* Dashboard Header */
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #14121f;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .user-info { font-size: 14px; color: #bbb; }
        .user-info strong { color: #fff; }
       
        #statusMessage {
            margin-top: 15px;
            padding: 12px;
            border-radius: 4px;
            background-color: #2c2541;
            text-align: center;
            font-size: 14px;
        }
    </style>
	
	    
	
</head>
<body>

<div class="container">
    <h2>Stremio Account Manager</h2>

    <!-- STATE 1: LOGIN FORM -->
    <div id="loginState">
        <form id="loginForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Stremio Email</label>
                    <input type="email" id="email" required placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Stremio Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
        </form>
    </div>

    <!-- STATE 2: ACTIVE REPO VIEW -->
    <div id="appState">
        <div class="user-header">
            <div class="user-info">Logged in as: <strong id="userDisplay"></strong></div>
            <button class="btn btn-danger" id="logoutBtn">Logout</button>
        </div>
        
        
        <div class="button-row" style="display: flex; gap: 10px; margin-bottom: 15px;">
			<button class="btn btn-primary" id="btnTraktSync">Trakt Sync</button>
			<!--button class="btn btn-primary" id="btnTraktSyncFix">Trakt Sync Fix</button-->
		</div>

		<div id="statusMessage" style="height: 50vh; overflow-y: auto; border: 1px solid #ccc; padding: 10px; text-align: left;"></div>

    </div>
</div>

<!--script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script-->
<script type="module">
    
	import { getTraktWatchedMovies, getTraktWatchedSeries, updateTraktWatchedItems } from './trakt.js';
	import { loginStremio, getStremioUser, getStremioLibrary, updateStremioWatchedItems } from './stremio.js';
	import { outerJoin } from './util.js';
	
    const loginState = document.getElementById('loginState');
    const appState = document.getElementById('appState');
    const loginForm = document.getElementById('loginForm');
    const btnSyncTraktMovies = document.getElementById('btnSyncTraktMovies');
	const btnSyncTraktSeries = document.getElementById('btnSyncTraktSeries');
    const logoutBtn = document.getElementById('logoutBtn');
    const statusMessage = document.getElementById('statusMessage');
    const userDisplay = document.getElementById('userDisplay');
	const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));
	
	let stremioProfile;

    // On Load: Get stremio profile if token saved
    window.addEventListener('DOMContentLoaded', async () => {        		
		try {
			const token = localStorage.getItem('stremio_token');									
			if (token) { stremioProfile = await getStremioUser(token); }								
			if (stremioProfile) showDashboard();
			else showLogin();											
		} catch (error) {
            alert(`Error: ${error.message}`);			
			showLogin();
		}
		
    });

    // Handle Login Form Submission
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        loginBtn.innerText = 'Connecting...';
        try {
            stremioProfile = await loginStremio(email, password);            
			localStorage.setItem('stremio_token', stremioProfile.authKey);												
			showDashboard();
        } catch (error) {
            alert(`Authentication Error: ${error.message}`);
        } finally {
            loginBtn.disabled = false;
            loginBtn.innerText = 'Login';
        }
    });
	
	
	 // Logout button
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('stremio_token');
        showLogin();
    });

    // Display Component State Toggles
    function showLogin() {
        appState.style.display = 'none';
        loginState.style.display = 'block';
        loginForm.reset();
    }

    function showDashboard() {       	
		loginState.style.display = 'none';
        appState.style.display = 'block';
        userDisplay.innerText = stremioProfile.email;
		statusMessage.innerText = '';	
    }
	
	
	function log(message, color = '#fff') {
		const timestamp = new Date().toISOString();    
		const logRow = `<div style="color: ${color};">${timestamp}: ${message}</div>`;    
		statusMessage.innerHTML += logRow;    
		statusMessage.scrollTop = statusMessage.scrollHeight;
	}
    
	
    btnTraktSync.addEventListener('click', async () => {		
		try {		
			btnTraktSync.disabled = true;
			statusMessage.innerHTML = '';				
			
			const traktToken = stremioProfile.trakt?.access_token || null;
			if (!traktToken) throw new Error('Trakt account not set in Stremio');
			
			log("Started");

			
			log("Getting trakt items...");			
			const traktWatchedMovies = await getTraktWatchedMovies(traktToken);							
			const traktWatchedSeries = await getTraktWatchedSeries(traktToken);
			const traktWatched = [...traktWatchedMovies, ...traktWatchedSeries];
			
			log("Getting stremio items...");			
			const stremioWatched = await getStremioLibrary(stremioProfile.authKey, {imdb: true});									
					
			log("Calculating diffs...");				
			const joinedWatched = outerJoin(traktWatched, stremioWatched, 'trakt', 'stremio');														
/*			
			const getDiffs = (dataList) => dataList.reduce((acc, item) => {
				const { trakt: t, stremio: s } = item;   
				if ((t?.season > 100) || (s?.season > 100 || t?.episode > 200 || s?.episode > 200 )) return acc;    // Remove extra long series (probably junk data)
				const tScore = t ? (t.season ?? 0) * 1000 + (t.episode ?? 0) : 0;
				const sScore = s ? (s.season ?? 0) * 1000 + (s.episode ?? 0) : 0;
				if (!t || sScore > tScore) acc.updateInTrakt.push(item);
				if (!s || tScore > sScore) acc.updateInStremio.push(item);
				return acc;
			}, { updateInTrakt: [], updateInStremio: [] });
			const { updateInTrakt, updateInStremio } = getDiffs(joinedWatched);
*/

			const getDiffs = (dataList) => dataList.reduce((acc, item) => {
				const { trakt: t, stremio: s } = item;   
				if (t?.season > 100 || s?.season > 100 || t?.episode > 200 || s?.episode > 200) return acc;    // Remove extra long series (probably junk data)				
				if (s && s.watched && !t ) acc.updateInTrakt.push(item);
				if (t && (!s || !s.watched)) acc.updateInStremio.push(item);
				return acc;
			}, { updateInTrakt: [], updateInStremio: [] });
			const { updateInTrakt, updateInStremio } = getDiffs(joinedWatched);


//			console.log('updateInTrakt');
//			console.log(JSON.stringify(updateInTrakt));
//			console.log('updateInStremio');
//			console.log(JSON.stringify(updateInStremio));
			
			
			
			log(`${updateInTrakt.length} items to be updated in trakt`);		
			if (updateInTrakt.length) {
				if (confirm(`Confirm trakt update (${updateInTrakt.length} items)?`)) {
					log("Updating trakt...");			
					const traktUpdateResult = await updateTraktWatchedItems(updateInTrakt, traktToken);
//					console.log('traktUpdateResult');
//					console.log(JSON.stringify(traktUpdateResult));
				}
				else {
					log("Skipped trakt update");		
				}
			}
			
			log(`${updateInStremio.length} items to be updated in stremio`);		
			if (updateInStremio.length) {
				if (confirm(`Confirm stremio update (${updateInStremio.length} items)?`)) {
					log("Updating stremio...");			
					const stremioUpdateResult = await updateStremioWatchedItems(updateInStremio, stremioProfile.authKey);
//					console.log('stremioUpdateResult');
//					console.log(JSON.stringify(stremioUpdateResult));
				}
				else {
					log("Skipped stremio update");		
				}
			}			
			
			log("Completed successfully", '#28a745');
						
		} catch (error) {           		
			log(`Error: ${error.message}`, '#ff6b6b');			
		} finally {
			btnTraktSync.disabled = false;
		}			
    });		
	
	
	
	
</script>

</body>
</html>
